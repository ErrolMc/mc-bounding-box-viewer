plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'bounding-box-viewer'
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroup 'com.terraformersmc' }
	}
	maven {
		name = 'Shedaniel'
		url = 'https://maven.shedaniel.me/'
		content { includeGroup 'me.shedaniel.cloth' }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"bounding-box-viewer" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// In-game tests in src/gametest: `gradlew runClientGameTest` starts a real client, finds structures in a world with a known seed and checks their boxes.
	configureTests {
		createSourceSet = true
		modId = 'bounding-box-viewer-gametest'
		enableGameTests = false
		enableClientGameTests = true
		// The seed mode test runs a dedicated server, which needs the Minecraft EULA (https://aka.ms/MinecraftEULA) accepted: the user has.
		eula = true
	}
}

// Seed survey: the seed planning test (and nothing else) on many random seeds, several game clients at once, each in
// its own run folder. Every settled piece goes to seed-survey/ and is summed up there (summary.txt; all-pieces.csv for
// sums of your own). See the README.
//   gradlew seedSurvey -Pseeds=100 -Pinstances=4 [-PworldType=normal|large_biomes|amplified] [-PperStructure=20] [-PseedList=1,2,3]
def survey = [
	instances: providers.gradleProperty('instances').getOrElse('4') as int,
	seeds: providers.gradleProperty('seeds').getOrElse('100'),
	seedList: providers.gradleProperty('seedList').getOrElse(''),
	worldType: providers.gradleProperty('worldType').getOrElse('normal'),
	perStructure: providers.gradleProperty('perStructure').getOrElse('20'),
	dir: file('seed-survey').absolutePath,
]
def surveyRuns = (0..<survey.instances).collect { i ->
	loom.runs.create("seedSurvey$i") {
		inherit loom.runs.clientGameTest
		runDir "build/run/seedSurvey/$i"
		ideConfigGenerated false
		vmArg '-Xmx6G'
		property 'bbv.survey', 'true'
		property 'bbv.survey.instance', "$i"
		property 'bbv.survey.instances', "${survey.instances}"
		property 'bbv.survey.seeds', survey.seeds
		property 'bbv.survey.seedList', survey.seedList
		property 'bbv.survey.type', survey.worldType
		property 'bbv.survey.perStructure', survey.perStructure
		property 'bbv.survey.dir', survey.dir
	}
	"runSeedSurvey$i"
}
def cleanSurveyRuns = tasks.register('cleanSeedSurveyRuns', Delete) {
	delete 'build/run/seedSurvey'
}
def surveySummary = tasks.register('seedSurveySummary', JavaExec) {
	group = 'fabric'
	description = 'Sums up the seed survey data in seed-survey/ (summary.txt), filing a survey just finished under the time.'
	classpath = sourceSets.gametest.output
	mainClass = 'com.errolmc.boundingboxviewer.gametest.SeedSurveySummary'
	args survey.dir
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
	mustRunAfter surveyRuns
}
surveyRuns.each { name ->
	tasks.named(name) {
		dependsOn cleanSurveyRuns
		finalizedBy surveySummary
	}
}
tasks.register('seedSurvey') {
	group = 'fabric'
	description = 'Runs the seed survey: -Pseeds, -Pinstances, -PworldType, -PperStructure, -PseedList (see build.gradle).'
	dependsOn surveyRuns
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Config screen (optional at runtime: only used when Mod Menu and Cloth Config are both installed)
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	compileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude group: 'net.fabricmc.fabric-api'
	}
	localRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude group: 'net.fabricmc.fabric-api'
	}

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	// Compile and run with JDK 25 no matter which JDK Gradle itself was started with.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

test {
	useJUnitPlatform()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
